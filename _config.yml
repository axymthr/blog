title: My Blog
email: your-email@example.com
description: >- # this means to ignore newlines until "baseurl:"
  A personal blog hosted on GitHub Pages using Jekyll.
baseurl: "/blog" # the subpath of your site, e.g. /blog
url: "https://axymthr.github.io" # the base hostname & protocol for your site, e.g. http://example.com

twitter_username: axymthr
github_username:  axymthr

# Minimal Mistakes remote theme
remote_theme: "mmistakes/minimal-mistakes@4.28.1"

minimal_mistakes_skin: "default"
search: false
breadcrumbs: false
words_per_minute: 200

author:
  name: "Axymthr"
  bio: "Writer and developer."
  location: "Online"
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/axymthr"

header:
  overlay_color: "#000"

plugins:
  - jekyll-feed
  - jekyll-include-cache
  - jekyll-remote-theme

# Exclude from processing.
exclude:
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
